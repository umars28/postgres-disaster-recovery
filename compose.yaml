x-pg-env: &pg-env
  POSTGRES_PASSWORD: postgres
  PGBACKREST_REPO2_S3_KEY: minioadmin
  PGBACKREST_REPO2_S3_KEY_SECRET: minioadmin-secret
  PGBACKREST_REPO2_CIPHER_PASS: ${PGBR_CIPHER_PASS:?isi di .env}
  PGBACKREST_REPO3_S3_KEY: minioadmin
  PGBACKREST_REPO3_S3_KEY_SECRET: minioadmin-secret
  PGBACKREST_REPO3_CIPHER_PASS: ${PGBR_CIPHER_PASS_REPO3:?isi di .env}

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD", "pg_isready", "-U", "postgres"]
  interval: 2s
  timeout: 3s
  retries: 5
  start_period: 600s
  start_interval: 1s

services:
  pg:
    build: .
    depends_on: [minio]
    environment: *pg-env
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
      - -c
      - archive_timeout=${ARCHIVE_TIMEOUT:-60}
    healthcheck: *pg-healthcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest
      - pglog:/var/log/pgbackrest
      - ./certs/ca/ca.crt:/etc/pgbackrest/ca.crt:ro

  scratch:
    build: .
    profiles: ["restore-test"]
    depends_on: [minio]
    environment: *pg-env
    command: ["postgres", "-c", "archive_mode=off"]
    healthcheck: *pg-healthcheck
    volumes:
      - scratchdata:/var/lib/postgresql/data
      - ./certs/ca/ca.crt:/etc/pgbackrest/ca.crt:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    command: ["--extend.query-path=/queries.yaml"]
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@pg:5432/postgres?sslmode=disable
    volumes:
      - ./monitoring/queries.yaml:/queries.yaml:ro

  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports: ["127.0.0.1:19091:9091"]

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dr.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-secret
    volumes:
      - minio-data:/data
      - ./certs/minio:/certs:ro

  aws:
    image: amazon/aws-cli
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin-secret
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./certs/ca/ca.crt:/ca.crt:ro
    entrypoint: ["aws", "--endpoint-url", "https://minio:9000", "--ca-bundle", "/ca.crt"]

  workload:
    image: postgres:16
    depends_on:
      pg:
        condition: service_healthy
    profiles: ["workload"]
    restart: "no"
    environment:
      PGHOST: pg
      PGUSER: postgres
      PGPASSWORD: postgres
      PGAPPNAME: workload
      WORKLOAD_INTERVAL: ${WORKLOAD_INTERVAL:-0.2}
    volumes:
      - ./scripts/workload.sh:/workload.sh:ro
      - ./runs:/runs
    entrypoint: ["bash", "/workload.sh"]

volumes:
  pgdata:
  pgbackrest:
  pglog:
  minio-data:
  scratchdata:
  prometheus-data: